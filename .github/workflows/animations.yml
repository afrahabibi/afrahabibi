name: Generate Contribution Animations

on:
  schedule:
    # Runs at 21:00 UTC every Saturday (weekly auto-update)
    - cron: "0 21 * * 6"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: animations
      cancel-in-progress: true

    steps:
      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate Snake Contribution Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff77a8&color_dots=#120a26,#1d1037,#381b53,#662a6b,#ff77a8
            dist/github-snake-light.svg?palette=github-light&color_snake=#7a3070&color_dots=#fff3d6,#ffd56b,#ffb7c5,#ff77a8,#7a3070

      - name: Push Animations to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
