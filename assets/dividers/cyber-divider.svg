<svg width="100%" height="24" viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#2F80ED" stop-opacity="1" />
      <stop offset="55%" stop-color="#2F80ED" stop-opacity="1" />
      <stop offset="85%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Line -->
  <line x1="50" y1="12" x2="950" y2="12" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#neonGlow)" />
  <!-- Core Crisp Line -->
  <line x1="100" y1="12" x2="900" y2="12" stroke="url(#cyberGrad)" stroke-width="1.5" />

  <!-- Center Diamond & Tech Nodes -->
  <polygon points="500,4 508,12 500,20 492,12" fill="#00F0FF" filter="url(#neonGlow)" />
  <circle cx="460" cy="12" r="3" fill="#2F80ED" />
  <circle cx="540" cy="12" r="3" fill="#A855F7" />
  <circle cx="380" cy="12" r="2" fill="#00F0FF" opacity="0.6" />
  <circle cx="620" cy="12" r="2" fill="#A855F7" opacity="0.6" />
</svg>
